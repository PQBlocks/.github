name: Feature request
description: Propose a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What are you trying to do that is hard today?}
    validations: {required: true}
  - type: textarea
    id: standard
    attributes: {label: Relevant standard, description: "Which standard, RFC or draft does this follow (e.g. FIPS 203, RFC 9629)?"}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
